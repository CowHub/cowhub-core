version: '2'

services:
  redis:
    image: redis
  ubuntu-core:
    build:
      context: .
      dockerfile: Dockerfile
    command: python /cowhub-core/lib/rabbit.py
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/cowhub-core
